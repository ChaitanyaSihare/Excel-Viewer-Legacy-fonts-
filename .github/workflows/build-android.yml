name: Build Android APK

on:
  push:
    branches: [ branched ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp favicon* apple-touch-icon.png icon-192.png icon-512.png www/ || true
          cp -r js www/

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capgo/capacitor-share-target @capacitor/filesystem

      - name: Add Android platform
        run: npx cap add android

      - name: Add Share Target intent filters
        shell: bash
        run: |
          python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()

          intent_filters = '''
          <intent-filter>
              <action android:name="android.intent.action.SEND" />
              <category android:name="android.intent.category.DEFAULT" />
              <data android:mimeType="application/vnd.ms-excel" />
          </intent-filter>
          <intent-filter>
              <action android:name="android.intent.action.SEND" />
              <category android:name="android.intent.category.DEFAULT" />
              <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
          </intent-filter>
          <intent-filter>
              <action android:name="android.intent.action.SEND" />
              <category android:name="android.intent.category.DEFAULT" />
              <data android:mimeType="font/ttf" />
          </intent-filter>
          <intent-filter>
              <action android:name="android.intent.action.SEND" />
              <category android:name="android.intent.category.DEFAULT" />
              <data android:mimeType="font/otf" />
          </intent-filter>
          '''

          content = content.replace('</activity>', intent_filters + '</activity>', 1)

          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Generate app icons
        run: |
          npm install @capacitor/assets --save-dev
          mkdir -p resources
          cp icon-512.png resources/icon.png
          cp icon-512.png resources/splash.png
          npx capacitor-assets generate --android

      - name: Fix duplicate Kotlin classes
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yatharoop-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
